[package]
name = "lester-sideload"
version = "0.1.0"
edition = "2024"
description = "Signs Lester for iPhone with the user's Apple ID and installs it over USB (uses isideload, MIT)"
license = "GPL-3.0-or-later"

[dependencies]
isideload = "0.5.2"
idevice = { version = "0.1.61", default-features = false, features = ["usbmuxd", "ring"] }
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
