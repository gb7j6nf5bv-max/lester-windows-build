# Builds Lester's two Windows programs on GitHub's Windows machines and tests Lester for Windows there.
# Run it from the repository's Actions tab (Windows build → Run workflow). The programs come out
# as the "windows-bin" download at the bottom of the run's page.
name: Windows build

on:
  workflow_dispatch:
  push:
    paths: ["app/**", "lester.py", "index.html", "tests/**", ".github/workflows/windows.yml"]

# A newer change cancels a build still running for an older one
concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # to publish the programs as a download (the "windows-bin" release)
    steps:
      - uses: actions/checkout@v4

      - name: Build Lester.exe and lester-sideload.exe
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-msvc
          # Keep build-machine paths out of the programs, and build Microsoft's C runtime in
          # (crt-static) so the programs don't need VCRUNTIME140.dll, which some PCs lack
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$(cygpath -w "$PWD")=lester"$'\x1f'"--remap-path-prefix=$(cygpath -w "$HOME")=home"$'\x1f'"-Ctarget-feature=+crt-static"
          (cd app/win_launcher && cargo build --release --target x86_64-pc-windows-msvc)
          (cd app/sideload && cargo build --release --locked --target x86_64-pc-windows-msvc)
          mkdir -p build/windows-bin
          cp app/win_launcher/target/x86_64-pc-windows-msvc/release/Lester.exe build/windows-bin/
          cp app/sideload/target/x86_64-pc-windows-msvc/release/lester-sideload.exe build/windows-bin/

      - name: Install the iPhone tools the way Lester does
        shell: pwsh
        run: |
          irm https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath uvbin
          $env:UV_TOOL_DIR = "$PWD\tools"; $env:UV_TOOL_BIN_DIR = "$PWD\uvbin"
          .\uvbin\uv.exe tool install --python 3.13 pymobiledevice3
          .\tools\pymobiledevice3\Scripts\pymobiledevice3.exe version

      - name: Test Lester for Windows
        shell: pwsh
        run: .\tools\pymobiledevice3\Scripts\python.exe tests\test_windows.py

      - name: Test it like a person would (double-click Lester.exe, use it, quit, open again)
        shell: powershell
        timeout-minutes: 25
        run: .\tests\e2e_windows.ps1

      - name: Share the test screenshots and logs
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$(cygpath "$RUNNER_TEMP")/lester-results"
          ls -la "$R" || exit 0
          gh release delete test-results --yes --cleanup-tag || true
          gh release create test-results "$R"/* --title "Latest Windows test results" \
            --notes "Screenshots and logs from the Windows build's tests." --prerelease --latest=false || true

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: build/windows-bin/

      - name: Publish the programs as a download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-bin --yes --cleanup-tag || true
          gh release create windows-bin build/windows-bin/Lester.exe build/windows-bin/lester-sideload.exe \
            --title "Lester for Windows programs" --notes "Built and tested by the Windows build workflow." --latest=false
